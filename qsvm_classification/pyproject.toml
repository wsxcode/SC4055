[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc4055-qsvm-clf"
version = "0.1.0"
description = "When does a quantum kernel help an SVM? Predict-then-verify study"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "qiskit>=2.1",
  "qiskit-aer>=0.14",
  "ucimlrepo>=0.0.3",
  "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
