[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc4055-qsvm-regression"
version = "0.1.0"
description = "Multi-dataset classical and quantum kernel regression benchmark"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "qiskit>=2.1",
  "qiskit-aer>=0.14",
  "ucimlrepo>=0.0.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
