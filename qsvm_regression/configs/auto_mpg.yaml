name: auto_mpg_quantum_kernel_regression
description: >-
  Nested-CV and later-model-year evaluation of quantum and classical precomputed-kernel SVR.
dataset:
  source: UCI Machine Learning Repository
  uci_id: 9
  target: mpg
  identifier: car_name
  temporal_column: model_year
preprocess:
  n_components: 4
  random_seed: 42
cv:
  outer_folds: 5
  inner_folds: 3
  random_seed: 42
temporal_holdout:
  latest_year_count: 2
svr:
  C: [0.1, 1.0, 10.0, 100.0]
  epsilon: [0.1, 0.5, 1.0]
kernels:
  classical: [linear, rbf, poly3]
  quantum_feature_maps: [rot2dof, belis]
  quantum_reps: 1
  noisy_simulation:
    depolarizing_1q: 0.001
    depolarizing_2q: 0.01
output_dir: results/auto_mpg_regression
